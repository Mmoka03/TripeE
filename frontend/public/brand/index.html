<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TripeE · 브랜드 아이콘</title>
    <link rel="icon" href="tripee-mark.svg" />
    <style>
      @font-face {
        font-family: TripeE;
        src: url('/design/pretendard.woff2');
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f6f1e7;
        color: #183c45;
        font-family: TripeE, sans-serif;
      }
      main {
        max-width: 1720px;
        margin: auto;
        padding: 70px 80px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #173c4530;
        padding-bottom: 28px;
      }
      header span {
        font-size: 13px;
        letter-spacing: 0.15em;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      h1 {
        font-size: 64px;
        letter-spacing: -3px;
        margin: 36px 0 16px;
      }
      p {
        font-size: 19px;
        line-height: 1.8;
        color: #60716c;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        margin-top: 36px;
      }
      .panel {
        min-height: 400px;
        border-radius: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        background: #fffdf8;
      }
      .panel.dark {
        background: #183c45;
        color: #fff8eb;
      }
      .panel > img {
        width: 190px;
        height: 190px;
      }
      .wordmark {
        display: flex;
        gap: 18px;
        align-items: center;
        font-size: 54px;
        font-weight: 800;
        letter-spacing: -2px;
      }
      .wordmark img {
        width: 68px;
        height: 68px;
      }
      .mono {
        width: 80px !important;
        height: 80px !important;
        filter: brightness(0) invert(1);
      }
      .sizes {
        display: flex;
        align-items: center;
        gap: 34px;
        margin-top: 38px;
      }
      .sizes div {
        display: flex;
        gap: 12px;
        align-items: center;
        color: #52675e;
        font-size: 12px;
      }
      .sizes img {
        display: block;
      }
      footer {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin-top: 40px;
        font-size: 13px;
        color: #64766c;
      }
      .caption {
        font-size: 12px;
        letter-spacing: 0.12em;
      }
      @media (max-width: 700px) {
        main {
          padding: 30px 20px;
        }
        h1 {
          font-size: 38px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .panel {
          min-height: 300px;
        }
        .sizes {
          flex-wrap: wrap;
        }
        footer {
          flex-direction: column;
        }
        .wordmark {
          font-size: 40px;
        }
        header {
          font-size: 12px;
          gap: 15px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header><span>TRIPEE / BRAND STUDY 01</span><a href="/">지도에서 보기 ↗</a></header>
      <h1>한 장의 지도, 다음 목적지.</h1>
      <p>
        접힌 지도와 두 지점을 잇는 길.<br />도시를 발견하고 여행의 시작점을 고르는 TripeE를
        담았습니다.
      </p>
      <div class="grid">
        <section class="panel">
          <img
            src="tripee-mark.svg"
            alt="접힌 지도 위에 경로와 목적지가 그려진 TripeE 대표 아이콘"
          /><span class="caption">PRIMARY / CORAL + DEEP TEAL</span>
        </section>
        <section class="panel dark">
          <div class="wordmark"><img src="tripee-mark.svg" alt="" />TripeE</div>
          <img class="mono" src="tripee-mark-mono.svg" alt="단색 지도 아이콘" /><span
            class="caption"
            >WORDMARK + MONOCHROME</span
          >
        </section>
      </div>
      <div class="sizes">
        <div><img src="tripee-mark.svg" width="16" height="16" alt="" />16 / 탭</div>
        <div><img src="tripee-mark.svg" width="24" height="24" alt="" />24</div>
        <div><img src="tripee-mark.svg" width="32" height="32" alt="" />32 / 헤더</div>
        <div><img src="tripee-mark.svg" width="64" height="64" alt="" />64 / 앱 아이콘</div>
      </div>
      <footer>
        <span>기성 로고·아이콘을 가져오지 않고 프로젝트용 SVG로 직접 구성함.</span
        ><span
          ><a href="tripee-mark.svg">컬러 SVG ↗</a> ·
          <a href="tripee-mark-mono.svg">단색 SVG ↗</a></span
        >
      </footer>
    </main>
  </body>
</html>
