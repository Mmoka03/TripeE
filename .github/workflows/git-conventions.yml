name: Git conventions

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  git-conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 규칙 검사기 검증
        run: node --test tools/git-conventions/check.test.mjs
      - name: 브랜치 이름 검사
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: node tools/git-conventions/check.mjs branch "$BRANCH_NAME"
      - name: PR 제목·대상·커밋 검사
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node tools/git-conventions/check.mjs title "$PR_TITLE"
          node tools/git-conventions/check.mjs pr "$HEAD_BRANCH" "$BASE_BRANCH"
          node tools/git-conventions/check.mjs range "$BASE_SHA..$HEAD_SHA"
