name: Backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'infra/**'
      - 'docs/openapi-v1.json'
      - 'tools/api-contract/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: 백엔드 테스트와 실행 JAR 빌드
        working-directory: backend
        run: ./gradlew build
      - name: 격리 PostgreSQL 통합과 동시성 검사
        working-directory: backend
        run: ./gradlew postgresContainerTest
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 계약 검증 의존성 설치
        run: pnpm --dir tools/api-contract install --frozen-lockfile
      - name: 실제 API 응답의 OpenAPI 계약 검사
        run: pnpm --dir tools/api-contract test:integration
