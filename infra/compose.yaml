name: tripee

services:
  db:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - tripee-postgres-data:/var/lib/postgresql
      - ../backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  db-provision:
    profiles: [setup]
    image: postgres:18.6-trixie
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TRIPEE_DB_PASSWORD: ${TRIPEE_DB_PASSWORD:-}
    volumes:
      - ./provision-backend.sql:/provision-backend.sql:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        : "$${TRIPEE_DB_PASSWORD:?Set TRIPEE_DB_PASSWORD in infra/.env}"
        psql -X --no-password --single-transaction -v ON_ERROR_STOP=1 -f /provision-backend.sql
        export PGUSER=tripee_backend PGPASSWORD="$$TRIPEE_DB_PASSWORD"
        exec psql -X --no-password -c 'SELECT id FROM tripee.city LIMIT 0'

volumes:
  tripee-postgres-data:
