spring:
  application:
    name: tripee-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  servlet:
    session:
      cookie:
        name: TRIPEE_SESSION
        http-only: true
        same-site: lax
      tracking-modes: cookie
      timeout: 1h
